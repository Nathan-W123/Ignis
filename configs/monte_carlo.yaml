# Ignis-M1: a generic 130 kN-class LOX/methane booster engine.
#
# This is a CONCEPTUAL engine invented for this project.  It is not a model of
# any real hardware, and nothing here should be read as a flight design.  The
# operating point was chosen so that the regenerative jacket closes with a
# realistic margin, using the design scan in docs/verification.md.
name: monte_carlo
description: >-
  Monte Carlo campaign over the Ignis-M1 design point.  Ten uncertain inputs
  spanning manufacturing tolerance, propellant conditioning, material scatter
  and correlation uncertainty.  The two heat-transfer multipliers make the
  empirical correlation uncertainty explicit rather than hiding it inside the
  correlations.

species:
  # Carbon / hydrogen / oxygen species only: nitrogen is absent from both
  # propellants, so including it would only add dead columns to the solve.
  elements: [C, H, O]

propellants:
  oxidizer: LOX
  fuel: LCH4
  oxidizer_temperature: 90.18     # K, normal boiling point
  fuel_temperature: 111.66        # K, normal boiling point
  mixture_ratio: 3.4              # O/F by mass

chamber:
  pressure: 5.5e6                 # Pa
  eta_c_star: 0.96                # empirical combustion efficiency
  composition: equilibrium        # shifting equilibrium through the nozzle

nozzle:
  throat_radius: 0.070            # m
  contraction_ratio: 2.8          # Ac/At
  chamber_length: 0.22            # m, cylindrical section
  converging_half_angle: 30.0     # deg
  chamber_fillet_ratio: 0.5       # R1/Rc
  throat_upstream_ratio: 1.5      # Ru/Rt
  throat_downstream_ratio: 0.382  # Rd/Rt (Rao)
  expansion_ratio: 20.0           # Ae/At
  type: bell
  bell_length_fraction: 0.8       # of the equivalent 15 deg cone
  bell_initial_angle: 33.0        # deg
  bell_exit_angle: 8.0            # deg
  stations: 400
  bartz_curvature: mean

performance:
  altitude: 0.0                   # m, U.S. Standard Atmosphere 1976
  auto_divergence: true           # lambda = (1 + cos theta_e)/2
  eta_nozzle: 1.0
  separation: summerfield
  resolve_internal_shocks: true

cooling:
  enabled: true
  coolant: methane
  material: CuCrZr
  num_channels: 300
  width_mode: fraction_of_pitch
  width_fraction: 0.50
  channel_height: 5.0e-3          # m
  wall_thickness: 0.6e-3          # m
  roughness: 5.0e-6               # m
  coolant_fuel_fraction: 1.0      # all of the fuel passes through the jacket
  inlet_temperature: 111.66       # K
  inlet_pressure: 15.0e6          # Pa
  counterflow: true               # coolant enters at the nozzle exit
  nusselt_correlation: dittus-boelter
  nusselt_multiplier: 1.0
  bartz_multiplier: 1.0
  gas_emissivity: 0.0             # radiation term disabled by default
  segments: 240

monte_carlo:
  samples: 2000
  seed: 20260917
  threads: 0                      # 0 => hardware concurrency
  record_samples: true
  fd_step: 1.0e-3
  inputs:
    - parameter: chamber.pressure
      distribution: normal
      mean: 5.5e6
      sigma: 1.1e5                # 2 % of the design point
    - parameter: propellants.mixture_ratio
      distribution: normal
      mean: 3.40
      sigma: 0.051                # 1.5 %
      min: 2.5
      max: 4.5
    - parameter: chamber.eta_c_star
      distribution: triangular
      low: 0.930
      mode: 0.960
      high: 0.980
    - parameter: nozzle.throat_radius
      distribution: normal
      mean: 0.0700
      sigma: 1.4e-4               # +/- 0.2 % machining tolerance
    - parameter: nozzle.expansion_ratio
      distribution: normal
      mean: 20.0
      sigma: 0.10
    - parameter: propellants.fuel_temperature
      distribution: uniform
      low: 108.0
      high: 115.0
    - parameter: cooling.wall_thickness
      distribution: normal
      mean: 6.0e-4
      sigma: 3.0e-5               # +/- 5 %
      min: 4.0e-4
      max: 9.0e-4
    - parameter: cooling.wall_conductivity
      distribution: normal
      mean: 320.0
      sigma: 16.0                 # 5 % material scatter
      min: 250.0
    - parameter: cooling.channel_height
      distribution: normal
      mean: 5.0e-3
      sigma: 1.0e-4
      min: 3.0e-3
    - parameter: cooling.bartz_multiplier
      distribution: lognormal
      median: 1.0
      sigma_log: 0.15             # Bartz correlation uncertainty
      min: 0.5
      max: 2.0
  outputs:
    - performance.thrust
    - performance.isp
    - performance.isp_vacuum
    - performance.mdot
    - performance.exit_pressure
    - chamber.temperature
    - chamber.c_star
    - cooling.max_wall_temperature
    - cooling.max_heat_flux
    - cooling.pressure_drop
    - cooling.outlet_temperature

output:
  directory: results/monte_carlo
  prefix: monte_carlo

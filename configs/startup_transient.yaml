# Ignis-M1: a generic 130 kN-class LOX/methane booster engine.
#
# This is a CONCEPTUAL engine invented for this project.  It is not a model of
# any real hardware, and nothing here should be read as a flight design.  The
# operating point was chosen so that the regenerative jacket closes with a
# realistic margin, using the design scan in docs/verification.md.
name: startup_transient
description: >-
  Startup and shutdown transient for the Ignis-M1 chamber.  A 2 ms fuel lead,
  a 35 ms valve ramp, an igniter-driven efficiency ramp reaching 0.92 at 20 ms,
  a 0.6 s burn and a near-simultaneous shutdown.  The valve timing keeps the
  chamber mixture ratio inside the tabulated range throughout, which the
  zero-dimensional products model requires.

species:
  # Carbon / hydrogen / oxygen species only: nitrogen is absent from both
  # propellants, so including it would only add dead columns to the solve.
  elements: [C, H, O]

propellants:
  oxidizer: LOX
  fuel: LCH4
  oxidizer_temperature: 90.18     # K, normal boiling point
  fuel_temperature: 111.66        # K, normal boiling point
  mixture_ratio: 3.4              # O/F by mass

chamber:
  pressure: 5.5e6                 # Pa
  eta_c_star: 0.96                # empirical combustion efficiency
  composition: equilibrium        # shifting equilibrium through the nozzle

nozzle:
  throat_radius: 0.070            # m
  contraction_ratio: 2.8          # Ac/At
  chamber_length: 0.22            # m, cylindrical section
  converging_half_angle: 30.0     # deg
  chamber_fillet_ratio: 0.5       # R1/Rc
  throat_upstream_ratio: 1.5      # Ru/Rt
  throat_downstream_ratio: 0.382  # Rd/Rt (Rao)
  expansion_ratio: 20.0           # Ae/At
  type: bell
  bell_length_fraction: 0.8       # of the equivalent 15 deg cone
  bell_initial_angle: 33.0        # deg
  bell_exit_angle: 8.0            # deg
  stations: 400
  bartz_curvature: mean

performance:
  altitude: 0.0                   # m, U.S. Standard Atmosphere 1976
  auto_divergence: true           # lambda = (1 + cos theta_e)/2
  eta_nozzle: 1.0
  separation: summerfield
  resolve_internal_shocks: true

cooling:
  enabled: false
  coolant: methane
  material: CuCrZr
  num_channels: 300
  width_mode: fraction_of_pitch
  width_fraction: 0.50
  channel_height: 5.0e-3          # m
  wall_thickness: 0.6e-3          # m
  roughness: 5.0e-6               # m
  coolant_fuel_fraction: 1.0      # all of the fuel passes through the jacket
  inlet_temperature: 111.66       # K
  inlet_pressure: 15.0e6          # Pa
  counterflow: true               # coolant enters at the nozzle exit
  nusselt_correlation: dittus-boelter
  nusselt_multiplier: 1.0
  bartz_multiplier: 1.0
  gas_emissivity: 0.0             # radiation term disabled by default
  segments: 240

transient:
  enabled: true
  # chamber_volume, throat_area and exit_area default to the nozzle geometry.
  ambient_pressure: 101325.0
  initial_pressure: 101325.0      # Pa, chamber pre-charged at ambient
  initial_temperature: 300.0      # K
  initial_mixture_ratio: 3.4
  oxidizer_schedule:              # kg/s
    open: 0.004
    ramp_up: 0.035
    value: 37.12
    close: 0.600
    ramp_down: 0.025
  fuel_schedule:                  # kg/s, 2 ms lead
    open: 0.002
    ramp_up: 0.035
    value: 10.92
    close: 0.602
    ramp_down: 0.026
  ignition:
    # Fraction of the heat of combustion actually released.  This is NOT the
    # same number as the steady combustion efficiency eta_c* = 0.96: withholding
    # (1 - eta_heat) of q_comb lowers the chamber temperature, and c* follows
    # roughly as sqrt(T).  The plateau below was calibrated so that the steady
    # part of this run reproduces the 5.5 MPa chamber pressure of
    # configs/methane_nominal.yaml to within 0.02 %, which makes the transient
    # and the steady analysis a cross-check on each other.
    times:  [0.000, 0.004, 0.020, 1.0e9]
    values: [0.00,  0.05,  0.874, 0.874]
  t_end: 0.80
  dt: 2.0e-6
  dt_output: 1.0e-3
  integrator: rk45
  rtol: 1.0e-9
  atol: 1.0e-12
  dt_max: 2.0e-4
  table:
    mr_min: 0.25
    mr_max: 12.0
    mr_points: 41
    t_min: 200.0
    t_max: 4000.0
    t_points: 97
    p_min: 5.0e4
    p_max: 2.0e7
    p_points: 13
  interpolation_samples: 200
  interpolation_seed: 20260917

output:
  directory: results/startup_transient
  prefix: startup_transient

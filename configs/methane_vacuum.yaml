# Ignis-M1: a generic 130 kN-class LOX/methane booster engine.
#
# This is a CONCEPTUAL engine invented for this project.  It is not a model of
# any real hardware, and nothing here should be read as a flight design.  The
# operating point was chosen so that the regenerative jacket closes with a
# realistic margin, using the design scan in docs/verification.md.
name: methane_vacuum
description: >-
  Ignis-M1 with a vacuum nozzle: the same chamber and throat, expanded to an
  area ratio of 45 and evaluated against zero ambient pressure.

species:
  # Carbon / hydrogen / oxygen species only: nitrogen is absent from both
  # propellants, so including it would only add dead columns to the solve.
  elements: [C, H, O]

propellants:
  oxidizer: LOX
  fuel: LCH4
  oxidizer_temperature: 90.18     # K, normal boiling point
  fuel_temperature: 111.66        # K, normal boiling point
  mixture_ratio: 3.4              # O/F by mass

chamber:
  pressure: 5.5e6                 # Pa
  eta_c_star: 0.96                # empirical combustion efficiency
  composition: equilibrium        # shifting equilibrium through the nozzle

nozzle:
  throat_radius: 0.070            # m
  contraction_ratio: 2.8          # Ac/At
  chamber_length: 0.22            # m, cylindrical section
  converging_half_angle: 30.0     # deg
  chamber_fillet_ratio: 0.5       # R1/Rc
  throat_upstream_ratio: 1.5      # Ru/Rt
  throat_downstream_ratio: 0.382  # Rd/Rt (Rao)
  expansion_ratio: 45.0           # Ae/At
  type: bell
  bell_length_fraction: 0.8       # of the equivalent 15 deg cone
  bell_initial_angle: 33.0        # deg
  bell_exit_angle: 8.0            # deg
  stations: 400
  bartz_curvature: mean

performance:
  ambient_pressure: 0.0           # Pa, vacuum
  auto_divergence: true           # lambda = (1 + cos theta_e)/2
  eta_nozzle: 1.0
  separation: summerfield
  resolve_internal_shocks: true
  # Finite-rate recombination through the nozzle at GRI-Mech 3.0's rates
  # (docs/theory.md 9.4): the delivered thrust carries its kinetic efficiency.
  kinetics:
    enabled: true
    apply: true

cooling:
  enabled: true
  coolant: methane
  material: CuCrZr
  num_channels: 300
  width_mode: fraction_of_pitch
  width_fraction: 0.50
  channel_height: 5.0e-3          # m
  wall_thickness: 0.6e-3          # m
  roughness: 5.0e-6               # m
  coolant_fuel_fraction: 1.0      # all of the fuel passes through the jacket
  inlet_temperature: 111.66       # K
  inlet_pressure: 15.0e6          # Pa
  counterflow: true               # coolant enters at the downstream end
  x_end_area_ratio: 10.0          # jacket ends here; the extension beyond is
                                  # assumed radiation cooled and is not modelled
  nusselt_correlation: dittus-boelter
  nusselt_multiplier: 1.0
  hot_gas_model: boundary_layer  # integral turbulent boundary layer; "bartz" for the closed form
  hot_gas_multiplier: 1.0
  gas_emissivity: 0.0             # radiation term disabled by default
  segments: 240
  # Wall film from the injector's outer row (Hatch & Papell, NASA TN D-130).
  # The turbulent boundary layer starts at the injector face, and without a
  # film the first ~3 cm of the jacket run near 1000 K; 3 % of the fuel as a
  # film holds them below the CuCrZr limit.  The RS-25 injects ~3 % of its
  # hydrogen the same way (Wang & Luong, J. Thermophys. 8(3), 1994).
  film:
    fuel_fraction: 0.03           # of the fuel flow
    slot_height: 0.5e-3           # m, equivalent slot of the film orifices

feed:
  enabled: true
  mode: sizing
  injector_stiffness: 0.20        # dp_injector / p_chamber
  minimum_stiffness: 0.15
  pump_efficiency: 0.65
  pump_inlet_pressure: 3.0e5
  oxidizer:
    line_length: 1.5
    line_diameter: 0.10
    fitting_k: 2.5
    viscosity: 1.9e-4             # Pa s, liquid oxygen near 90 K
    injector_cd: 0.78
  fuel:
    line_length: 1.8
    line_diameter: 0.07
    fitting_k: 3.0
    viscosity: 1.2e-4             # Pa s, liquid methane near 112 K
    injector_cd: 0.75

output:
  directory: results/methane_vacuum
  prefix: m1vac

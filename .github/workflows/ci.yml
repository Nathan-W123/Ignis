name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            build_type: Release
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            build_type: Debug
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            build_type: Release
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libeigen3-dev libyaml-cpp-dev catch2 \
            ${{ matrix.cc }} ${{ matrix.cxx }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DIGNIS_WERROR=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Show version
        run: ./build/bin/ignis_engine --version

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -j "$(nproc)"

      # A Debug build is far too slow for the end-to-end scenarios.
      - name: Run the shipped scenarios
        if: matrix.build_type == 'Release'
        run: ./scripts/run_all.sh --quick --stage "methane hydrogen nozzle sweeps optimize"

      - name: Run the transient and Monte Carlo campaigns
        if: matrix.build_type == 'Release' && matrix.compiler == 'gcc'
        run: ./scripts/run_all.sh --quick --stage "transient mc bench"

      - name: Generate the figures
        if: matrix.build_type == 'Release' && matrix.compiler == 'gcc'
        run: |
          python3 -m pip install --quiet --break-system-packages -r python/requirements.txt
          python3 python/make_figures.py --results results --figures results/figures

      - name: Upload results
        if: matrix.build_type == 'Release' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: ignis-results
          path: |
            results/**/*.csv
            results/**/*.json
            results/**/*.png
            results/**/*.gif
            results/*.txt
          retention-days: 14

  lint-python:
    name: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --quiet -r python/requirements.txt
          python -m pip install --quiet ruff
      - name: Lint
        run: ruff check python tools --select E9,F63,F7,F82,F401 --ignore F401
      - name: Import check
        run: |
          python -c "import sys; sys.path.insert(0,'python'); import ignis_viz; print(ignis_viz.__version__)"
          python tools/build_thermo_db.py --help > /dev/null
          python tools/build_coolant_tables.py --help > /dev/null
          python tools/make_reference_data.py --help > /dev/null
          python python/make_figures.py --help > /dev/null
